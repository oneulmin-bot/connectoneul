<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>사단법인 오늘은 · 매니저 커피챗</title>
  <meta name="description" content="매니저 소개를 보고 원하는 시간에 30분 커피챗을 신청하세요.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="assets/img/symbol.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE/fonts/static/woff2/SUITE.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20261111a">
</head>
<body>

  <header class="topbar">
    <div class="wrap">
      <div class="topbar-inner">
        <a class="brand" href="./" aria-label="사단법인 오늘은 커피챗 홈"><img src="assets/img/logo-oneuleun.png" alt="사단법인 오늘은" width="150" height="26"><span class="brand-sub">커피챗</span></a>
        <a class="top-link" href="admin.html">관리자</a>
      </div>
    </div>
    <nav class="gnb" aria-label="주요 메뉴">
      <div class="wrap">
        <a href="./" data-nav="home" aria-current="page">홈</a>
        <a href="times.html" data-nav="times">전체 타임 보기</a>
        <a href="./#my" data-nav="my">내 신청 확인</a>
        <a href="https://oneul.or.kr" data-nav="org" target="_blank" rel="noopener">사단법인 오늘은<span class="ext" aria-hidden="true">↗</span></a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero card">
      <span class="motif" aria-hidden="true"><i class="m1"></i><i class="m2"></i><i class="m3"></i><i class="m4"></i><i class="m5"></i></span>
      <span class="section-chip">사단법인 오늘은 <b>COFFEE CHAT</b></span>
      <h1>궁금했던 이야기,<br><em>매니저와 커피 한 잔</em>으로</h1>
      <p data-setting="intro">관심 있는 매니저를 골라 30분 커피챗을 신청해 보세요.</p>
      <div class="hero-meta">
        <span class="chip"><b>장소</b>공덕역 인근</span>
        <span class="chip"><b>시간</b>1회 30분</span>
      </div>
      <button type="button" class="btn btn-line" id="openLookup">내 신청 확인하기</button>
    </section>

    <div class="section-head">
      <h2>매니저 소개</h2>
      <span id="managerCount"></span>
    </div>
    <div class="manager-grid" id="managerGrid" aria-live="polite">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>

  <footer><img src="assets/img/symbol.png" alt="" width="28" height="27"><div>운영 · <span data-setting="orgName">사단법인 오늘은</span></div><div class="en-label">TODAY TO TOMORROW</div></footer>

  <!-- 내 신청 확인 -->
  <div class="sheet-backdrop" id="lookupSheet" hidden role="dialog" aria-modal="true" aria-labelledby="lookupTitle">
    <div class="sheet card">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2 id="lookupTitle">내 신청 확인</h2>
        <button type="button" class="sheet-close" data-close-sheet="lookupSheet" aria-label="닫기">✕</button>
      </div>

      <form id="lookupForm" novalidate>
        <div class="field">
          <label for="lkName">이름</label>
          <input class="input" id="lkName" name="name" autocomplete="name" maxlength="20" placeholder="홍길동">
          <p class="field-error"></p>
        </div>
        <div class="field">
          <label for="lkPhone">연락처</label>
          <input class="input" id="lkPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000">
          <p class="field-error"></p>
        </div>
        <div class="field">
          <label for="lkPin">확인번호 (숫자 4자리)</label>
          <input class="input" id="lkPin" name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="신청할 때 정한 4자리">
          <p class="field-error"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="lookupBtn">조회하기</button>
      </form>

      <div id="lookupResult" hidden>
        <div class="my-list" id="myList"></div>
        <p class="field-help" style="margin-top:14px">확정된 커피챗은 매니저가 남겨주신 연락처로 직접 안내드립니다.</p>
        <button type="button" class="btn btn-ghost btn-block" id="lookupAgain">다른 정보로 조회</button>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js?v=20261111a"></script>
  <script src="assets/js/api.js?v=20261111a"></script>
  <script src="assets/js/common.js?v=20261111a"></script>
  <script src="assets/js/home.js?v=20261111a"></script>
</body>
</html>
